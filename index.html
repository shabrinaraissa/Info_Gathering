<style>

:root{
  --bg:#2e4a2b; --wood:#5a3a1a; --wood-2:#8a5a2b; --wood-dk:#2a1a0c; --cream:#fff1cf; --cream-2:#f3dfae; --ink:#3b2a1a;
  --gold:#e8b93c; --gold-lt:#e8c98a; --red:#d4533f; --leaf:#4f9a3d; --muted:#7a5f3d;
  --f:'Pixelify Sans','Courier New',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:8px 8px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.app{max-width:560px;margin:0 auto;display:grid;gap:8px}

.hud{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--wood-2);border:3px solid var(--wood);border-radius:8px;padding:6px 8px;
  box-shadow:inset 0 0 0 2px var(--gold-lt),0 3px 0 var(--wood-dk);color:var(--cream)}
.hud .ttl{flex:1 1 130px;min-width:0;font-weight:700;font-size:15px;overflow-wrap:anywhere;text-shadow:1px 1px 0 var(--wood-dk)}
.chip{background:var(--wood);border-radius:5px;padding:3px 8px;font-size:13px;white-space:nowrap;border:2px solid var(--wood-dk)}
.tog{background:var(--cream);color:var(--ink);border:2px solid var(--wood-dk);border-radius:5px;padding:3px 9px;font-size:13px;font-weight:700;box-shadow:0 2px 0 var(--wood-dk)}
.tog:active{transform:translateY(2px);box-shadow:none}

.stage{position:relative;width:min(100%,calc((100vh - 150px) * .6923));min-width:240px;margin:0 auto;aspect-ratio:180/260;border:5px solid var(--wood);border-radius:6px;
  box-shadow:0 0 0 2px var(--gold-lt),0 5px 0 var(--wood-dk);background:#79b84e;overflow:hidden;touch-action:manipulation}
#map{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hit{position:absolute;z-index:2;border-radius:6px}
.lab{position:absolute;z-index:3;transform:translate(-50%,-50%);font:700 11px/1 var(--f);padding:4px 7px;background:var(--wood);color:var(--cream);
  border:2px solid var(--gold-lt);border-radius:4px;white-space:nowrap;box-shadow:0 2px 0 var(--wood-dk)}
.lab.seen{background:#3d6a2c}
.lab .num{font-size:15px;line-height:1;color:var(--gold);margin-right:4px;text-shadow:1px 1px 0 var(--wood-dk)}
.lab.seen .num{color:#fff}
.lab .bang{position:absolute;right:-9px;top:-13px;width:14px;height:14px;background:var(--red);color:#fff;font-size:11px;line-height:14px;text-align:center;border:1px solid var(--wood-dk);border-radius:3px;animation:bob .7s steps(2) infinite}
.lab.seen .bang{display:none}
@keyframes bob{50%{transform:translateY(-3px)}}
.me{position:absolute;z-index:4;border-radius:8px}
.hint{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--cream);border:2px solid var(--wood);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none;animation:bob .9s steps(2) infinite}
.hint::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--wood);border-bottom:0}
.tip{margin:0;text-align:center;font-size:12.5px;color:var(--cream);opacity:.9}

.back{position:fixed;inset:0;background:rgba(20,14,6,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.back.on{opacity:1;pointer-events:auto}
.dlg{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:min(100%,560px);max-height:82%;z-index:60;transform:translateY(110%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.dlg.on{transform:none}
.box{background:var(--cream);border:4px solid var(--wood);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:inset 0 0 0 3px var(--gold-lt);display:flex;flex-direction:column;min-height:0;flex:1;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 8px;position:relative}

.dtxt{min-width:0;flex:1;padding-right:34px}
.plate{display:inline-flex;align-items:center;gap:5px;background:var(--wood);color:var(--cream);font-weight:700;font-size:13px;padding:3px 9px;border-radius:4px;margin-bottom:5px}

.blk{display:grid;gap:8px;min-width:0}

.tl{display:grid;gap:6px}
.tl div{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start}
.tl b{background:var(--wood);color:var(--cream);text-align:center;border-radius:4px;padding:2px 4px;font-size:13px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;background:var(--cream-2);border:2px solid var(--wood-2);border-radius:6px;padding:8px 10px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.note{background:var(--cream-2);border:2px dashed var(--wood-2);border-radius:6px;padding:8px 10px;font-size:14px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;color:var(--cream);background:var(--leaf);border:3px solid var(--wood-dk);border-radius:8px;padding:10px 12px;font-weight:700;box-shadow:0 3px 0 var(--wood-dk)}

.lnk.off{background:#a89a80;pointer-events:none}
.search{width:100%;background:#fff;border:3px solid var(--wood-2);border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink)}
.grp{background:var(--cream-2);border:3px solid var(--wood-2);border-radius:8px;padding:8px 10px;display:grid;gap:3px}
.grp b{font-size:17px;color:var(--wood)}
.grp span{overflow-wrap:anywhere}
.grp mark{background:var(--gold);color:var(--ink);padding:0 2px;border-radius:2px}
.empty{color:var(--muted);margin:0}
.cos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cos>div{background:var(--cream-2);border:3px solid var(--wood-2);border-radius:8px;padding:10px 8px;display:grid;gap:5px;justify-items:center;text-align:center;min-width:0}

.cos b{font-size:15px}.cos small{color:var(--muted)}
.cos p{font-size:13.5px;overflow-wrap:anywhere}
.sw{display:flex;gap:4px}.sw i{width:14px;height:14px;border:2px solid var(--wood-dk);border-radius:3px;display:block}
.lock-card{width:100%;background:var(--cream-2);border:3px dashed var(--wood-2);border-radius:8px;padding:12px;display:grid;gap:4px;justify-items:center;text-align:center}
.lock-card .em{font-size:30px}
.foot{padding:8px 14px 12px}
.ok{width:100%;background:var(--gold);color:var(--wood-dk);font-weight:700;border:3px solid var(--wood-dk);border-radius:8px;padding:9px;box-shadow:0 3px 0 var(--wood-dk)}
.ok:active{transform:translateY(3px);box-shadow:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);background:var(--cream);border:3px solid var(--wood);border-radius:8px;padding:8px 12px;z-index:90;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90%;box-shadow:0 3px 0 var(--wood-dk)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.bang,.hint{animation:none}*{transition:none!important}}

  var fl=Math.floor(t*4)%2;[[10,92],[30,92]].forEach(function(p,i){R(ctx,p[0],p[1],2,8,'#6b4226');R(ctx,p[0]+2,p[1],5-fl,2,i?'#e8c25a':'#d4533f');R(ctx,p[0]+2,p[1]+2,3-fl,1,i?'#e8c25a':'#d4533f')});
  for(var i=0;i<12;i++)for(var j=0;j<3;j++){var k=(i+j+Math.floor(t*3))%3;R(ctx,66+i*4,50+j*4-2+2,4,4,['#e8c25a','#e0523f','#5aa9e6'][k])}
  var bx=90+Math.round(Math.sin(t*1.5)*10);R(ctx,bx-2,22,5,5,'#cfd8e8');R(ctx,bx-1,23,2,2,'#fff');R(ctx,bx,19,1,3,'#999');
  if(Math.floor(t*2)%2)R(ctx,128-12,115,2,2,'#ff3b30');
  var sp=Math.floor(t*3)%4;[[69,194],[75,198],[71,201],[66,198]].forEach(function(p,q){if(q===sp)R(ctx,p[0],p[1],1,1,'#fff6a0')});
  if(!calm){
    for(var b=0;b<3;b++){var bxp=30+b*50+Math.sin(t*.7+b*2)*18,byp=120+b*36+Math.cos(t*.9+b)*10;if(b===1)byp=40+Math.cos(t*.9)*8;var wing=Math.floor(t*8+b)%2;R(ctx,bxp,byp,wing?3:1,1,['#ffb3c0','#ffe48a','#b38cff'][b]);R(ctx,bxp+1,byp+1,1,1,'#3b2a1a')}
    ctx.fillStyle='rgba(0,40,0,'+(.09*(1-nightT))+')';for(var cl=0;cl<2;cl++){var cx=((t*3+cl*110)%(W+80))-50,cy=60+cl*120;ctx.fillRect(Math.round(cx),cy,36,8);ctx.fillRect(Math.round(cx)+6,cy-3,24,3);ctx.fillRect(Math.round(cx)+4,cy+8,28,3)}
  }
  /* karakter dan NPC diurutkan menurut y */
  var cols=mode==='day'?EVENT.costume.day:EVENT.costume.night,fr=path.length?1+(Math.floor(walked/5)%2):0,bob=(!path.length&&Math.floor(t*1.6)%2)?1:0;
  var list=NPC.map(function(n,i){return{y:n.y,f:function(){drawChar(ctx,n.x-6,n.y-16+((Math.floor(t*1.4+i)%2)?1:0),n.dir,0,n.col,true)}}});
  list.push({y:pos.y,f:function(){drawChar(ctx,Math.round(pos.x)-6,Math.round(pos.y)-16-(fr===0?bob:0),dir,fr,cols,true)}});
  list.sort(function(a,b){return a.y-b.y}).forEach(function(o){o.f()});
  if(nightT>0){ctx.globalAlpha=nightT;ctx.drawImage(nightC,0,0);
    for(i=0;i<8&&!calm;i++){if((Math.floor(t*2+i*3)%4)>0)R(ctx,20+((i*47+t*3)%150),100+((i*61)%130)+Math.sin(t+i)*4,1,1,'#fff3a0')}
    ctx.globalAlpha=1;ctx.save();ctx.globalAlpha=nightT;drawChar(ctx,Math.round(pos.x)-6,Math.round(pos.y)-16,dir,fr,cols,false);ctx.restore();ctx.globalAlpha=1}
  meBtn.style.left=pct(pos.x-12,W);meBtn.style.top=pct(pos.y-24,H);
  hint.style.left=pct(pos.x,W);hint.style.top=pct(pos.y-20,H);
  requestAnimationFrame(frame);
}

/* ---------- dialog ---------- */
function render(blk){
  var w=el('div','blk');if(blk.h)w.appendChild(el('h4',null,blk.h));
  if(blk.t==='p')w.appendChild(el('p',null,blk.text));
  else if(blk.t==='note')w.appendChild(el('div','note',blk.text));
  else if(blk.t==='list'){var u=el('ul','list');blk.items.forEach(function(x){u.appendChild(el('li',null,x))});w.appendChild(u)}
  else if(blk.t==='timeline'){var tl=el('div','tl');blk.items.forEach(function(x){var d=el('div');d.appendChild(el('b',null,x[0]));d.appendChild(el('span',null,x[1]));tl.appendChild(d)});w.appendChild(tl)}
  else if(blk.t==='kv'){var l=el('dl','kv');blk.items.forEach(function(x){l.appendChild(el('dt',null,x[0]));l.appendChild(el('dd',null,x[1]))});w.appendChild(l)}
  else if(blk.t==='links'){blk.items.forEach(function(x){var ok=x[1]&&x[1]!=='#';var a=el('a','lnk'+(ok?'':' off'));if(ok){a.href=x[1];a.target='_blank';a.rel='noopener'}
    var s=el('span');s.appendChild(document.createTextNode(ok?x[0]:x[0]+' (link belum tersedia)'));if(x[2]&&ok)s.appendChild(el('small',null,x[2]));a.appendChild(s);a.appendChild(el('span',null,ok?'↗':'⏳'));w.appendChild(a)})}
  else if(blk.t==='costume'){var g=el('div','cos');blk.items.forEach(function(it){var c=el('div');var cn=el('canvas');cn.width=14;cn.height=20;var cx=cn.getContext('2d');cx.imageSmoothingEnabled=false;
      var col=EVENT.costume[it.c];drawChar(cx,1,2,'d',0,col,true);c.appendChild(cn);c.appendChild(el('b',null,it.when));c.appendChild(el('small',null,it.time));
      var sw=el('div','sw');[col.hat,col.shirt,col.pants].forEach(function(k){var i=el('i');i.style.background=k;sw.appendChild(i)});c.appendChild(sw);c.appendChild(el('p',null,it.desc));g.appendChild(c)});w.appendChild(g)}
  else if(blk.t==='secret'){var c=el('button','lock-card');c.type='button';c.appendChild(el('span','em','🔒'));c.appendChild(el('b',null,blk.title));c.appendChild(el('span',null,'Ketuk untuk intip'));
    c.onclick=function(){c.replaceChildren(el('span','em','🤫'),el('span',null,blk.reveal))};w.appendChild(c)}
  else if(blk.t==='groups'){var q=null,box=el('div','blk');
    if(blk.search){q=el('input','search');q.type='search';q.id='q'+Math.random().toString(36).slice(2,7);q.placeholder='Cari namamu...';q.setAttribute('aria-label','Cari nama');w.appendChild(q)}
    var draw=function(){box.replaceChildren();var term=q?q.value.trim().toLowerCase():'',n=0;
      blk.items.forEach(function(g){if(term&&(g.name+' '+g.info).toLowerCase().indexOf(term)<0)return;n++;var c=el('div','grp');c.appendChild(el('b',null,g.name));var sp=el('span'),i=term?g.info.toLowerCase().indexOf(term):-1;
        if(i>=0){sp.appendChild(document.createTextNode(g.info.slice(0,i)));sp.appendChild(el('mark',null,g.info.slice(i,i+term.length)));sp.appendChild(document.createTextNode(g.info.slice(i+term.length)))}else sp.textContent=g.info;c.appendChild(sp);box.appendChild(c)});
      if(!n)box.appendChild(el('p','empty','Nama tidak ditemukan. Coba ejaan lain.'))};
    if(q)q.oninput=draw;draw();w.appendChild(box)}
  return w}
var dlg=$('dlg'),back=$('back'),typer=null,toastT;
function dlgOpen(){return dlg.classList.contains('on')}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
function open(id){
  var s=SPOTS[id];hideHint();
  $('dFace').textContent=s.face;$('dName').replaceChildren();if(s.num)$('dName').appendChild(el('span','num',s.num));$('dName').appendChild(el('span',null,s.who));
  var b=$('dBody');b.replaceChildren();s.blocks.forEach(function(x){b.appendChild(render(x))});b.scrollTop=0;
  var say=$('dSay');say.textContent='';clearInterval(typer);var i=0;
  if(calm){say.textContent=s.say}else typer=setInterval(function(){i++;say.textContent=s.say.slice(0,i);if(i>=s.say.length)clearInterval(typer)},24);
  say.onclick=function(){clearInterval(typer);say.textContent=s.say};
  dlg.classList.add('on');back.classList.add('on');dlg.setAttribute('aria-hidden','false');document.body.classList.add('lock');$('dOk').focus();
  if(!visited[id]){visited[id]=true;try{localStorage.setItem('desa-visited',JSON.stringify(visited))}catch(e){}
    var n=refreshSeen();if(n===TOTAL)setTimeout(function(){toast('🎉 Semua info sudah kamu baca. Siap berangkat!')},900)}
}
function close(){clearInterval(typer);dlg.classList.remove('on');back.classList.remove('on');dlg.setAttribute('aria-hidden','true');document.body.classList.remove('lock')}
$('dX').onclick=$('dOk').onclick=back.onclick=close;
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});

build();requestAnimationFrame(frame);
window.__desa={open:open,goTo:goTo};
})();
